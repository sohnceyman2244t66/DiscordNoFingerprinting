<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Secure Launcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .shield-icon {
            width: 32px;
            height: 32px;
            fill: #4ade80;
        }

        .status {
            font-size: 14px;
            color: #a8d8ea;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.4);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(74, 222, 128, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(74, 222, 128, 0);
            }
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 16px;
            margin-bottom: 10px;
            color: #e2e8f0;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #cbd5e0;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #4ade80;
            background: rgba(255, 255, 255, 0.15);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
        }

        .proxy-fields {
            display: none;
            margin-top: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .proxy-fields.active {
            display: block;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-launch {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            color: #ffffff;
        }

        .btn-launch:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(74, 222, 128, 0.4);
        }

        .btn-launch:disabled {
            background: #64748b;
            cursor: not-allowed;
            transform: none;
        }

        .btn-settings {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-settings:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }

        .error-message {
            display: none;
            padding: 10px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            border-radius: 8px;
            color: #fca5a5;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .error-message.active {
            display: block;
        }

        .success-message {
            display: none;
            padding: 10px;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            border-radius: 8px;
            color: #86efac;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .success-message.active {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #4ade80;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <svg class="shield-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L4 7V13C4 17.55 7.84 21.74 12 23C16.16 21.74 20 17.55 20 13V7L12 2M12 11.5C12.83 11.5 13.5 10.83 13.5 10C13.5 9.17 12.83 8.5 12 8.5C11.17 8.5 10.5 9.17 10.5 10C10.5 10.83 11.17 11.5 12 11.5M12 4.8L17.65 8V13C17.65 16.05 15.77 18.98 12 19.95C8.23 18.98 6.35 16.05 6.35 13V8L12 4.8Z"/>
                </svg>
                Discord Secure
            </h1>
            <div class="status">
                <span class="status-dot"></span>
                Protected Mode Active
            </div>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <div class="section">
            <div class="section-title">Authentication</div>
            <div class="input-group">
                <label for="token">Discord Token (Optional)</label>
                <input type="password" id="token" placeholder="Leave empty to login manually">
                <button class="btn-check" id="checkTokenBtn" style="margin-top: 10px; width: 100%; background: #5865F2;">Check Token</button>
                <div id="tokenStatus" style="margin-top: 10px; padding: 10px; background: rgba(0, 0, 0, 0.2); border-radius: 8px; display: none;">
                    <div style="font-size: 14px; color: #a8d8ea;">
                        <span id="tokenStatusText"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Proxy Configuration</div>
            <div class="checkbox-group">
                <input type="checkbox" id="enableProxy">
                <label for="enableProxy">Enable Proxy Connection</label>
            </div>

            <div class="proxy-fields" id="proxyFields">
                <div class="input-group">
                    <label for="proxyProtocol">Protocol</label>
                    <select id="proxyProtocol">
                        <option value="http">HTTP</option>
                        <option value="https">HTTPS</option>
                        <option value="socks5">SOCKS5</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="proxyHost">Host</label>
                    <input type="text" id="proxyHost" placeholder="proxy.example.com">
                </div>

                <div class="input-group">
                    <label for="proxyPort">Port</label>
                    <input type="number" id="proxyPort" placeholder="8080">
                </div>

                <div class="input-group">
                    <label for="proxyUsername">Username (Optional)</label>
                    <input type="text" id="proxyUsername" placeholder="Leave empty if not required">
                </div>

                <div class="input-group">
                    <label for="proxyPassword">Password (Optional)</label>
                    <input type="password" id="proxyPassword" placeholder="Leave empty if not required">
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Privacy Options</div>
            <div class="checkbox-group">
                <input type="checkbox" id="autoLogin" checked>
                <label for="autoLogin">Auto-login with saved token</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="clearCache" checked>
                <label for="clearCache">Clear cache on exit</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="randomUserAgent" checked>
                <label for="randomUserAgent">Randomize user agent</label>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>Launching secure Discord session...</div>
        </div>

        <div class="button-group">
            <button class="btn-launch" id="launchBtn">Launch Discord</button>
            <button class="btn-settings" id="saveBtn">Save Settings</button>
        </div>

        <div class="footer">
            Your privacy is protected • New session each launch • Token encrypted locally
        </div>
    </div>

    <script src="launcher.js"></script>
</body>
</html>
